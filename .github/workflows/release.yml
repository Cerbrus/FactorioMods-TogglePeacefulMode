name: Release

# Releasing a new version:
#   1. Bump "version" in info.json and add a matching "Version: x.y.z" block to changelog.txt.
#   2. Commit, then tag it:  git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow packages the mod, creates a GitHub Release with the changelog
#      section as notes, and uploads the zip to the Factorio mod portal.
#
# Re-running for an existing tag (e.g. the portal upload failed): Actions → Release → "Run workflow",
# enter the tag. Steps that already succeeded (GitHub Release exists) are skipped.
#
# Requires the repository secret FACTORIO_API_KEY (factorio.com/profile, usage "ModPortal: Upload Mods").
# Without it the portal upload step is skipped with a warning.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.4.0'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches info.json
        id: meta
        run: |
          name="$(jq -r .name info.json)"
          version="$(jq -r .version info.json)"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match info.json version $version"; exit 1
          fi
          grep -qx "Version: $version" changelog.txt \
            || { echo "::error file=changelog.txt::no 'Version: $version' entry"; exit 1; }
          {
            echo "name=$name"
            echo "version=$version"
            echo "factorio_version=$(jq -r .factorio_version info.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Package
        id: build
        run: |
          zip="$(bash scripts/package.sh)"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog.txt
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '
            /^-{99}$/      { if (found) exit; next }
            /^Version: /   { found = ($2 == v); next }
            found && /^Date: / { next }
            found          { print }
          ' changelog.txt \
          | sed -E 's/^  ([^ ].*):$/### \1/; s/^    - /- /; s/^      /  /' \
          > dist/release-notes.md
          printf '\n_For Factorio %s._\n' "${{ steps.meta.outputs.factorio_version }}" >> dist/release-notes.md
          cat dist/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping"
            exit 0
          fi
          gh release create "$TAG" "${{ steps.build.outputs.zip }}" \
            --title "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}" \
            --notes-file dist/release-notes.md

      - name: Upload to Factorio mod portal
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
          MOD_NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if [ -z "$FACTORIO_API_KEY" ]; then
            echo "::warning::FACTORIO_API_KEY secret not set; skipping mod portal upload"
            exit 0
          fi

          # Re-runs: the portal rejects duplicate versions, so skip if this one is already up.
          if curl -sSf "https://mods.factorio.com/api/mods/$MOD_NAME" \
              | jq -e --arg v "$VERSION" 'any(.releases[]; .version == $v)' >/dev/null; then
            echo "$MOD_NAME $VERSION is already on the mod portal; skipping upload"
            exit 0
          fi

          # POST and split the body from the status code; the portal returns its error
          # (InvalidApiKey, UnknownMod, InvalidModRelease, ...) as JSON in the body.
          post() { # post <url> <curl -F args...>
            local url="$1"; shift
            local response status
            response="$(curl -sS -w $'\n%{http_code}' -X POST -H "Authorization: Bearer $FACTORIO_API_KEY" "$@" "$url")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$status" != "200" ]; then
              echo "::error::$url returned HTTP $status: $body"; exit 1
            fi
          }

          post https://mods.factorio.com/api/v2/mods/releases/init_upload -F "mod=$MOD_NAME"
          upload_url="$(jq -er .upload_url <<<"$body")"

          post "$upload_url" -F "file=@$ZIP"
          echo "$body" | jq .
          echo "Uploaded $ZIP to https://mods.factorio.com/mod/$MOD_NAME"

      - name: Sync mod portal page details
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: |
          if [ -z "$FACTORIO_API_KEY" ]; then
            echo "::warning::FACTORIO_API_KEY secret not set; skipping portal details sync"
            exit 0
          fi
          bash scripts/portal-edit-details.sh
