[shortcut-name]
tpm-toggle-peaceful=Toggle peaceful mode

[shortcut-description]
tpm-toggle-peaceful=Toggle peaceful mode on all surfaces.\nMobile enemy units are killed so they respawn with the new setting. Demolishers are never killed.

[controls]
tpm-toggle-peaceful=Toggle peaceful mode

[controls-description]
tpm-toggle-peaceful=Same as the shortcut-bar button: toggles peaceful mode on all surfaces.

[mod-setting-name]
tpm-peaceful=Peaceful mode
tpm-admin-only=Only admins can toggle peaceful mode

[mod-setting-description]
tpm-peaceful=The current peaceful state. Changing it here does the same as the shortcut-bar button: every surface is updated and mobile enemy units are killed so they respawn with the new setting.
tpm-admin-only=In multiplayer, only admins can use the shortcut-bar button and hotkey. Map settings are always admin-only.

[tpm]
state-on=on
state-off=off
announce-player=__1__ turned peaceful mode __2__.
announce=Peaceful mode was turned __1__.
admin-only=Only admins can toggle peaceful mode on this server.
